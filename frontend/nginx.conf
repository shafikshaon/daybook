server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Disable cache for index.html to always get fresh content
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # SPA routing - serve index.html for non-existent routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets with content hashes for 1 year (they're versioned)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Enable ETags for better cache validation
        etag on;
    }
}
